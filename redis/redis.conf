i# Redis Configuration

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# General
daemonize no
loglevel notice

# Persistence
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Security
# requirepass your_password

# Database
databases 16
